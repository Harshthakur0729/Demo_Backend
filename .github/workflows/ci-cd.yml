name: Backend Spring Boot CI

on:
  push:
    branches: [ "oct", "main" ]
  pull_request:
    branches: [ "oct", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -Dmaven.test.skip=true

      - name: Build Docker Image Test
        run: docker build -t auth-demo-backend:latest .