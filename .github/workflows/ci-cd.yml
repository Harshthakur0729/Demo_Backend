name: CI Pipeline (Build, Scan & Push)

on:
  push:
    branches: ["oct"]
  pull_request:
    branches: ["oct"]

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube deep scan ke liye zaroori hai

      # 2. Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # 3. Maven Build
      - name: Build Spring Boot App with Maven
        run: mvn clean package -DskipTests

      # 4. SonarQube Scan (SonarCloud)
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          mvn sonar:sonar \
            -Dsonar.organization=harshthakur0729 \
            -Dsonar.projectKey=Harshthakur0729_Demo_Backend \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend_images:latest
            ${{ secrets.DOCKER_USERNAME }}/backend_images:${{ github.sha }}