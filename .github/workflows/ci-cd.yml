name: Build and Push Docker Image

on:
  push:
    branches: ["main", "master", "oct"] # Jis branch par commit karne par push karna hai

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub Repository se Code Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java / JDK 21 Setup
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21" # <--- Change this from '17' to '21'
          distribution: "temurin"
          cache: maven

      # 3. Spring Boot Application Build (Generate JAR)
      - name: Build Spring Boot App with Maven
        run: mvn clean package -DskipTests

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build Docker Image and Push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend_image:latest
            ${{ secrets.DOCKER_USERNAME }}/backend_image:${{ github.sha }}
