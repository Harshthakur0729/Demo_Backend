spring.application.name=auth-demo

# Port assigned dynamically by Render
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:251198@Ht}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Settings
jwt.secret=${JWT_SECRET:9a2f8c4e1b7d3f6a8e0c2b5d7e9f1a4b6c8d0e3f5a7b9c1d3e5f7a9b2c4d6e8f}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration Property
allowed.cors.origin=${ALLOWED_CORS_ORIGIN:http://localhost:5173}